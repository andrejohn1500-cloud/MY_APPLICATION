
  deploy-functions:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g firebase-tools
      - run: cd functions && npm install
      - run: firebase deploy --only functions --project dresapps-quiz --token "${{ secrets.FIREBASE_TOKEN }}"
